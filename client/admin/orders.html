<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — RAVERS Admin</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">
      <div>
        <p class="wordmark">RAVERS</p>
        <span class="eyebrow">Admin</span>
      </div>
      <button type="button" class="admin-nav-toggle" id="admin-nav-toggle">Menu</button>
    </div>
    <nav class="admin-nav" id="admin-nav">
      <a href="index.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html" aria-current="page">Orders</a>
      <a href="custom-orders.html">Custom Requests</a>
      <a href="customers.html">Customers</a>
    </nav>
    <div class="admin-sidebar__foot">
      <div class="admin-sidebar__user">
        <strong id="admin-user-name">—</strong>
        Administrator
      </div>
      <button type="button" class="btn btn--ghost btn--sm btn--block" data-logout>Log Out</button>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Orders</h1>
        <p>Ready-made orders placed through the storefront.</p>
      </div>
      <a href="../index.html" class="link-action">View Storefront &rarr;</a>
    </div>

    <div class="admin-content" id="admin-orders-root">
      <div class="admin-toolbar">
        <div class="admin-toolbar__filters">
          <label class="form-label" for="order-status-filter" style="margin:0;">Status</label>
          <select class="form-select" id="order-status-filter">
            <option value="">All</option>
            <option value="Order Received">Order Received</option>
            <option value="Confirmed">Confirmed</option>
            <option value="In Production">In Production</option>
            <option value="Quality Check">Quality Check</option>
            <option value="Ready for Delivery">Ready for Delivery</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="orders-table-body">
            <tr><td colspan="6" class="cell-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
